services:
  mini-kanban:
    image: ${IMAGE_REF:-mini-kanban:local}
    container_name: mini-kanban
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - mini-kanban-data:/app/instance
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  mini-kanban-data:
