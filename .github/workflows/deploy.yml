name: Secure build and deploy Mini Kanban

on:
  push:
    branches: [feat/mini-kanban-mvp]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: mini-kanban-local-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, scan, sign and deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deployment has its own gates: a failed PR check cannot be bypassed by
      # a direct push to this branch.
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test and security dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests, Bandit and pip-audit
        run: |
          PYTHONPATH=. pytest tests/ -q
          bandit -r app.py -q
          pip-audit -r requirements.txt

      - name: Run Semgrep SAST
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/src:ro" \
            returntocorp/semgrep:1.179.0 \
            semgrep scan --config p/default --error /src/app.py

      - name: Define image repository
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mini-kanban" >> "$GITHUB_ENV"

      - name: Verify Docker and local port availability
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          if ss -ltnH '( sport = :8000 )' | grep -q . && ! docker container inspect mini-kanban >/dev/null 2>&1; then
            echo 'Port 8000 is already in use by another service.' >&2
            exit 1
          fi

      - name: Build application image
        run: docker build --tag "$IMAGE:${{ github.sha }}" .

      - name: Scan image with Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            image --ignore-unfixed --severity CRITICAL --exit-code 1 \
            --format json --output /output/trivy-image.json "$IMAGE:${{ github.sha }}"

      - name: Generate image SBOM with Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            image --format cyclonedx --output /output/sbom-image.cdx.json "$IMAGE:${{ github.sha }}"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push immutable build candidate
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Resolve pushed image digest
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}")"
          test -n "$image_ref"
          echo "IMAGE_REF=$image_ref" >> "$GITHUB_ENV"
          echo "Deploy candidate: $image_ref"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign image with GitHub OIDC identity
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature before deployment
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/feat/mini-kanban-mvp" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"

      - name: Replace the running container with the verified digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
          docker rm --force mini-kanban 2>/dev/null || true
          docker run --detach \
            --name mini-kanban \
            --restart unless-stopped \
            --publish 0.0.0.0:8000:8000 \
            --volume mini-kanban-data:/app/instance \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "$IMAGE_REF"

      - name: Verify local health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 mini-kanban
          exit 1

      - name: Run OWASP ZAP baseline DAST scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --volume "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -m 1 -I -J zap-report.json

      - name: Upload container security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-reports
          path: |
            trivy-image.json
            sbom-image.cdx.json
            zap-report.json
          if-no-files-found: warn

      - name: Report deployed container
        run: docker inspect --format 'State={{.State.Status}} Health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} Image={{.Config.Image}} Ports={{json .NetworkSettings.Ports}}' mini-kanban
