name: DevSecOps pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-and-security:
    name: Tests, secret scan, SAST, SCA and IaC
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: PYTHONPATH=. pytest tests/ -q

      - name: Run Bandit Python SAST
        run: bandit -r app.py -q

      - name: Run Semgrep SAST
        run: semgrep scan --config p/default --error app.py

      - name: Run pip-audit SCA and generate Python SBOM
        run: pip-audit -r requirements.txt --format cyclonedx-json --output sbom-python.cdx.json

      - name: Scan container configuration as code
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/work:ro" \
            --volume "$PWD:/output" \
            aquasec/trivy:0.68.2 \
            config --severity CRITICAL --exit-code 1 --format json \
            --output /output/trivy-config.json /work

      - name: Upload Python SBOM and IaC scan
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-ci-reports
          path: |
            sbom-python.cdx.json
            trivy-config.json
          if-no-files-found: error
